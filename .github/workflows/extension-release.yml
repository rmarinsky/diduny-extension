name: Extension release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: extension-release-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged_pr="$(gh api \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number' | \
            head -n 1)"
          if [ -z "$merged_pr" ]; then
            echo "Commit $GITHUB_SHA was not merged through a pull request targeting main."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Build verified extension package
        run: bun run release:extension
      - name: Reserve version tag at the verified commit
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          tag="extension-v$version"
          git tag --force "$tag" "$GITHUB_SHA"
          if git push origin "refs/tags/$tag"; then
            :
          fi
          remote_tag_sha="$(git ls-remote --refs origin "refs/tags/$tag" | cut -f1)"
          if [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag $tag already points to $remote_tag_sha, not $GITHUB_SHA."
            exit 1
          fi
      - name: Publish versioned download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          tag="extension-v$version"
          gh release create "$tag" \
            ".output/diduny-extension-$version-chrome.zip" \
            --verify-tag \
            --generate-notes

name: Extension release

on:
  push:
    tags:
      - "extension-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Verify version tag
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$GITHUB_REF_NAME" = "extension-v$version"
      - name: Build verified extension package
        run: bun run release:extension
      - name: Publish versioned download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          gh release create "$GITHUB_REF_NAME" \
            ".output/diduny-extension-$version-chrome.zip" \
            --generate-notes
